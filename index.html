<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Codex Web" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/codexui-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>Codex Web</title>
  </head>
  <body class="bg-slate-950">
    <div id="app"></div>
    <script>
      (() => {
        const report = (tag, message, extra = {}) => {
          try {
            const payload = JSON.stringify({
              tag,
              message: String(message || ''),
              extra: {
                userAgent: navigator.userAgent,
                href: location.href,
                ...extra,
              },
            });
            if (navigator.sendBeacon) {
              navigator.sendBeacon('/codex-api/debug-log', new Blob([payload], { type: 'application/json' }));
              return;
            }
            fetch('/codex-api/debug-log', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: payload,
              keepalive: true,
            }).catch(() => {});
          } catch {
            // Diagnostics must never block app startup.
          }
        };

        window.__codexReportClientError = report;

        if (!Object.hasOwn) {
          Object.hasOwn = (target, key) => Object.prototype.hasOwnProperty.call(Object(target), key);
        }
        if (!Array.prototype.toReversed) {
          Object.defineProperty(Array.prototype, 'toReversed', {
            value() { return Array.prototype.slice.call(this).reverse(); },
            configurable: true,
            writable: true,
          });
        }
        if (!Array.prototype.toSorted) {
          Object.defineProperty(Array.prototype, 'toSorted', {
            value(compareFn) { return Array.prototype.slice.call(this).sort(compareFn); },
            configurable: true,
            writable: true,
          });
        }
        if (!Array.prototype.toSpliced) {
          Object.defineProperty(Array.prototype, 'toSpliced', {
            value(start, deleteCount, ...items) {
              const next = Array.prototype.slice.call(this);
              next.splice(start, deleteCount, ...items);
              return next;
            },
            configurable: true,
            writable: true,
          });
        }
        if (!window.structuredClone) {
          window.structuredClone = (value) => JSON.parse(JSON.stringify(value));
        }

        try {
          new RegExp('(?<=a)b');
        } catch {
          const NativeRegExp = RegExp;
          const gfmEmailLookbehindPrefix = '(?<=^|\\s|\\p{P}|\\p{S})([-.\\w+]+)@';
          const CompatRegExp = function(pattern, flags) {
            if (typeof pattern === 'string' && pattern.startsWith(gfmEmailLookbehindPrefix)) {
              pattern = pattern.replace('(?<=^|\\s|\\p{P}|\\p{S})', '(?:^|\\s|\\p{P}|\\p{S})');
            }
            return new NativeRegExp(pattern, flags);
          };
          CompatRegExp.prototype = NativeRegExp.prototype;
          Object.setPrototypeOf(CompatRegExp, NativeRegExp);
          window.RegExp = CompatRegExp;
        }

        const showBootFailure = (message) => {
          const app = document.getElementById('app');
          if (!app || app.childElementCount > 0 || app.textContent.trim()) return;
          app.innerHTML = [
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#020617;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:24px;">',
            '<div style="max-width:520px;border:1px solid rgba(148,163,184,.35);border-radius:14px;background:rgba(15,23,42,.96);padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);">',
            '<h1 style="margin:0 0 10px;font-size:18px;">CodexUI failed to start</h1>',
            '<p style="margin:0 0 12px;line-height:1.45;color:#cbd5e1;">Safari reported a client startup error. The server has logged the details.</p>',
            `<pre style="white-space:pre-wrap;overflow:auto;max-height:220px;margin:0;padding:12px;border-radius:10px;background:#0f172a;color:#fecaca;font-size:12px;">${String(message).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]))}</pre>`,
            '</div></div>',
          ].join('');
        };

        window.addEventListener('error', (event) => {
          const message = event.error?.stack || event.message || 'Unknown script error';
          report('client-startup-error', message, {
            filename: event.filename,
            lineno: event.lineno,
            colno: event.colno,
          });
          showBootFailure(message);
        });
        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason;
          const message = reason?.stack || reason?.message || String(reason || 'Unhandled rejection');
          report('client-unhandled-rejection', message);
          showBootFailure(message);
        });
        window.setTimeout(() => {
          const app = document.getElementById('app');
          if (app && app.childElementCount === 0 && !app.textContent.trim()) {
            const message = 'The app did not render within 8 seconds.';
            report('client-startup-timeout', message);
            showBootFailure(message);
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
