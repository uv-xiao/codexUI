services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: codexui-tailscale
    restart: unless-stopped
    entrypoint:
      - /usr/local/bin/tailscaled
    command:
      - --socket=/tmp/tailscaled.sock
      - --statedir=/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-codexui-ios}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - codexui-tailscale-state:/var/lib/tailscale

volumes:
  codexui-tailscale-state:
    name: codexui-tailscale-state
