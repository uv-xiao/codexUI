<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>CodexUI iOS Probe</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: Canvas;
        color: CanvasText;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 560px);
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 8px;
        padding: 18px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }

      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 8px 12px;
        margin: 0;
        font-size: 14px;
      }

      dt {
        font-weight: 700;
      }

      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .ok {
        color: #15803d;
      }

      .bad {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CodexUI iOS Probe</h1>
      <dl>
        <dt>HTML</dt>
        <dd class="ok">loaded</dd>
        <dt>Time</dt>
        <dd id="time"></dd>
        <dt>URL</dt>
        <dd id="url"></dd>
        <dt>Manifest</dt>
        <dd id="manifest">checking...</dd>
        <dt>Debug log</dt>
        <dd id="debug-log">checking...</dd>
      </dl>
    </main>
    <script>
      const setText = (id, text, ok) => {
        const node = document.getElementById(id);
        node.textContent = text;
        node.className = ok ? 'ok' : 'bad';
      };

      document.getElementById('time').textContent = new Date().toISOString();
      document.getElementById('url').textContent = location.href;

      fetch('/manifest.webmanifest', { cache: 'no-store' })
        .then((response) => setText('manifest', `HTTP ${response.status}`, response.ok))
        .catch((error) => setText('manifest', error.message || String(error), false));

      fetch('/codex-api/debug-log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tag: 'ios-probe',
          message: 'iOS probe loaded',
          extra: {
            href: location.href,
            userAgent: navigator.userAgent,
            time: new Date().toISOString(),
          },
        }),
        keepalive: true,
      })
        .then((response) => setText('debug-log', `HTTP ${response.status}`, response.ok))
        .catch((error) => setText('debug-log', error.message || String(error), false));
    </script>
  </body>
</html>
